<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027학년도 수시 지원 대학 및 시간대별 경쟁률</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase 연동을 위한 라이브러리 추가 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body { background-color: #FAFAFA; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 4px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: #D1D5DB; }
    </style>
</head>
<body class="text-gray-800 font-sans min-h-screen py-10 px-4 md:px-10">

    <div class="max-w-7xl mx-auto space-y-8">
        <!-- 헤더 영역 -->
        <header class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase bg-indigo-50 px-3 py-1 rounded-full">2027 수시 원서 지원 전략</span>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mt-2">대학·학과 시간대별 경쟁률 및 3개년 분석</h1>
                <p class="text-sm text-gray-500 mt-1">과년도 입시 결과 비교 및 2027학년도 실시간 경쟁률 추이를 한눈에 확인하세요.</p>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <!-- PC 백업 및 불러오기 버튼 -->
                <button onclick="exportDataFile()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-3 rounded-xl transition shadow-sm text-sm flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    PC 백업하기
                </button>
                <label class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-4 py-3 rounded-xl transition shadow-sm text-sm cursor-pointer flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    데이터 불러오기
                    <input type="file" accept=".json" onchange="importDataFile(event)" class="hidden">
                </label>
                
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-3 rounded-xl transition shadow-sm flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    지원 대학/학과 추가
                </button>
            </div>
        </header>

        <!-- 메인 컨텐츠 그리드 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 좌측: 등록된 대학 리스트 -->
            <div class="lg:col-span-1 space-y-4">
                <h2 class="text-lg font-bold text-gray-800 px-1">지원 관리 목록</h2>
                <div id="univ-list" class="space-y-2.5">
                    <!-- 자바스크립트로 동적 생성됨 -->
                </div>
            </div>

            <!-- 우측: 상세 정보 및 그래프 영역 -->
            <div class="lg:col-span-2 space-y-8">
                <!-- 선택된 대학 상세 정보 카드 -->
                <div id="detail-card" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 space-y-6">
                    <div class="text-center py-12 text-gray-400">
                        <p>좌측에서 대학을 선택하거나 새로운 대학을 추가해주세요.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 대학/학과 추가 및 수정 모달 -->
    <div id="univ-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-3xl w-full p-8 shadow-xl max-h-[90vh] overflow-y-auto space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 id="modal-title" class="text-xl font-bold text-gray-900">새 지원 대학 등록</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>

            <form id="univ-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
                <input type="hidden" id="edit-id">
                
                <!-- 상향/적정/안정 체크박스 영역 -->
                <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <span class="text-xs font-semibold text-gray-700">지원 전략 구분:</span>
                    <label class="flex items-center gap-1.5 cursor-pointer text-sm font-medium"><input type="checkbox" id="tag-high" class="accent-red-600 w-4 h-4"> 상향</label>
                    <label class="flex items-center gap-1.5 cursor-pointer text-sm font-medium"><input type="checkbox" id="tag-fit" class="accent-indigo-600 w-4 h-4"> 적정</label>
                    <label class="flex items-center gap-1.5 cursor-pointer text-sm font-medium"><input type="checkbox" id="tag-safe" class="accent-emerald-600 w-4 h-4"> 안정</label>
                </div>

                <!-- 기본 정보 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">대학교명</label>
                        <input type="text" id="univ-name" required placeholder="예: 한국대학교" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">전형명</label>
                        <input type="text" id="univ-type" required placeholder="예: 학생부교과(교과우수자)" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">학과명</label>
                        <input type="text" id="univ-major" required placeholder="예: 컴퓨터공학과" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <!-- 연도별 입시 결과 입력 및 컷 기준 선택 -->
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="text-sm font-bold text-gray-700">입시 결과 및 모집인원 입력</h4>
                        <div class="flex items-center gap-3 text-xs text-gray-600 bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-200">
                            <span class="font-semibold text-gray-700">최저 기준 선택:</span>
                            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="chk-50" class="accent-indigo-600"> 50%</label>
                            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="chk-70" class="accent-indigo-600"> 70%</label>
                            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="chk-90" class="accent-indigo-600"> 90%</label>
                            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="chk-100" class="accent-indigo-600"> 100%</label>
                        </div>
                    </div>

                    <div class="grid grid-cols-6 gap-2 text-center text-xs font-semibold text-gray-500 mb-2">
                        <div>연도</div>
                        <div>모집인원</div>
                        <div>최종 경쟁률</div>
                        <div>추합인원</div>
                        <div>평균등급</div>
                        <div>최저</div>
                    </div>
                    <div class="space-y-2">
                        <!-- 2027 (맨 위) -->
                        <div class="grid grid-cols-6 gap-2 items-center bg-indigo-50/50 p-1.5 rounded-xl border border-indigo-100">
                            <span class="text-sm font-bold text-indigo-600 text-center">2027</span>
                            <input type="number" id="q-2027" placeholder="모집정원" class="border border-gray-200 rounded-lg p-2 text-sm text-center bg-white">
                            <span class="text-xs text-gray-400 text-center col-span-4">실시간 경쟁률은 아래에서 입력 / 2027 입결은 추후 입력</span>
                        </div>
                        <!-- 2026 -->
                        <div class="grid grid-cols-6 gap-2 items-center">
                            <span class="text-sm font-medium text-gray-600 text-center">2026</span>
                            <input type="number" id="q-2026" placeholder="모집" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="number" step="0.01" id="r-2026" placeholder="경쟁률" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="number" id="extra-2026" placeholder="추합" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="number" step="0.01" id="avg-2026" placeholder="평균" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="text" id="min-2026" placeholder="최저" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                        </div>
                        <!-- 2025 -->
                        <div class="grid grid-cols-6 gap-2 items-center">
                            <span class="text-sm font-medium text-gray-600 text-center">2025</span>
                            <input type="number" id="q-2025" placeholder="모집" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="number" step="0.01" id="r-2025" placeholder="경쟁률" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="number" id="extra-2025" placeholder="추합" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="number" step="0.01" id="avg-2025" placeholder="평균" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="text" id="min-2025" placeholder="최저" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                        </div>
                        <!-- 2024 -->
                        <div class="grid grid-cols-6 gap-2 items-center">
                            <span class="text-sm font-medium text-gray-600 text-center">2024</span>
                            <input type="number" id="q-2024" placeholder="모집" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="number" step="0.01" id="r-2024" placeholder="경쟁률" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="number" id="extra-2024" placeholder="추합" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="number" step="0.01" id="avg-2024" placeholder="평균" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                            <input type="text" id="min-2024" placeholder="최저" class="border border-gray-200 rounded-lg p-2 text-sm text-center">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-600 font-medium hover:bg-gray-50 transition">취소</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 자바스크립트 로직 -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBdxzJL0EtEiLUo-7Jy_TEjKI-34vfJ7RU",
            authDomain: "univ-6457b.firebaseapp.com",
            databaseURL: "https://univ-6457b-default-rtdb.firebaseio.com",
            projectId: "univ-6457b",
            storageBucket: "univ-6457b.firebasestorage.app",
            messagingSenderId: "401584012360",
            appId: "1:401584012360:web:09cad66dab872cc5b12c7d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let universities = [];
        let selectedId = null;
        let chartInstance = null;
        let allUnivChartInstance = null;
        let isFirstLoad = true;

        db.ref('univ_data').on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (data) {
                // 기존 데이터에서 rate가 없는 항목 필터링 제거 (쓰레기 데이터 삭제)
                universities = data.map(u => {
                    if (u.rates2027) {
                        u.rates2027 = u.rates2027.filter(slot => slot.rate !== '' && slot.rate !== null && slot.rate !== undefined);
                    } else {
                        u.rates2027 = [];
                    }
                    return u;
                });
            } else {
                universities = [{
                    id: 1,
                    name: '한국대',
                    type: '학생부교과',
                    major: '컴퓨터공학과',
                    tags: { high: true, fit: false, safe: false },
                    history: {
                        2024: { quota: 15, rate: 14.2, extra: 12, avg: 2.2, min: '3합6' },
                        2025: { quota: 15, rate: 16.8, extra: 15, avg: 2.0, min: '3합6' },
                        2026: { quota: 18, rate: 21.4, extra: 10, avg: 1.9, min: '3합5' },
                        2027: { quota: 20 }
                    },
                    cutStandards: { '50': false, '70': true, '90': false, '100': false },
                    rates2027: []
                }];
                saveToStorage();
            }

            if (isFirstLoad) {
                selectedId = universities.length > 0 ? universities[0].id : null;
                isFirstLoad = false;
            } else if (selectedId && !universities.find(item => item.id === selectedId)) {
                selectedId = universities.length > 0 ? universities[0].id : null;
            }

            renderList();
            renderDetail();
        });

        function saveToStorage() {
            db.ref('univ_data').set(universities);
        }

        function exportDataFile() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(universities, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "univ_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDataFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        universities = importedData;
                        saveToStorage();
                        alert("데이터를 성공적으로 서버에 불러왔습니다!");
                    } else {
                        alert("올바른 데이터 파일이 아닙니다.");
                    }
                } catch (error) {
                    alert("파일을 읽는 중 오류가 발생했습니다.");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function selectDateCheckbox(selectedCheckbox) {
            ['09/07', '09/08', '09/09', '09/10', '09/11'].forEach(d => {
                const cb = document.getElementById(`date-chk-${d}`);
                if (cb && cb !== selectedCheckbox) cb.checked = false;
            });
        }

        function addDynamicRateRealtime() {
            const u = universities.find(item => item.id === selectedId);
            if(!u) return;

            const dates = ['09/07', '09/08', '09/09', '09/10', '09/11'];
            let chosenDate = '';
            for (let d of dates) {
                const cb = document.getElementById(`date-chk-${d}`);
                if (cb && cb.checked) {
                    chosenDate = d;
                    break;
                }
            }

            if (!chosenDate) {
                alert('입력할 날짜(9/7 ~ 9/11 중 하나)를 먼저 체크해주세요.');
                return;
            }

            const rateInputEl = document.getElementById('quick-rate-input');
            const rateVal = rateInputEl.value;

            if (!rateVal) {
                alert('경쟁률 숫자를 입력해주세요.');
                return;
            }

            if(!u.rates2027) u.rates2027 = [];

            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${hours}:${minutes}`;

            const fullDateTime = `${chosenDate} ${currentTimeStr}`;
            
            u.rates2027.push({ time: fullDateTime, rate: rateVal });
            u.rates2027.sort((a, b) => a.time.localeCompare(b.time));

            rateInputEl.value = '';
            saveToStorage();
            renderDetail();
        }

        function renderList() {
            const listEl = document.getElementById('univ-list');
            if (universities.length === 0) {
                listEl.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-gray-100 text-center text-gray-400 text-sm">등록된 대학이 없습니다.</div>`;
                return;
            }

            const sortedUnivs = [...universities].sort((a, b) => a.name.localeCompare(b.name, 'ko'));

            listEl.innerHTML = sortedUnivs.map(u => {
                const tagObj = u.tags || { high: false, fit: false, safe: false };
                let tagText = '';
                if (tagObj.high) tagText += '[상향] ';
                if (tagObj.fit) tagText += '[적정] ';
                if (tagObj.safe) tagText += '[안정] ';

                return `
                    <div onclick="selectUniv(${u.id})" class="bg-white py-3 px-4 rounded-xl border ${u.id === selectedId ? 'border-indigo-600 ring-2 ring-indigo-50/50' : 'border-gray-100 hover:border-gray-200'} cursor-pointer transition shadow-sm flex flex-col gap-1.5">
                        <div class="flex justify-between items-center">
                            <span class="text-[11px] font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">${u.type}</span>
                            <div class="flex gap-2">
                                <button onclick="event.stopPropagation(); editUniv(${u.id})" class="text-gray-400 hover:text-gray-600 text-[11px]">수정</button>
                                <button onclick="event.stopPropagation(); deleteUniv(${u.id})" class="text-red-400 hover:text-red-600 text-[11px]">삭제</button>
                            </div>
                        </div>
                        <div class="flex items-baseline gap-1 overflow-hidden">
                            ${tagText ? `<span class="text-red-600 font-bold text-[15px] whitespace-nowrap">${tagText}</span>` : ''}
                            <h3 class="font-bold text-gray-900 text-[15px] whitespace-nowrap">${u.name}</h3>
                            <p class="text-[13px] text-gray-500 truncate">${u.major}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDetail() {
            const detailEl = document.getElementById('detail-card');
            const u = universities.find(item => item.id === selectedId);

            if (!u) {
                detailEl.innerHTML = `<div class="text-center py-12 text-gray-400"><p>대학을 선택해주세요.</p></div>`;
                if(chartInstance) chartInstance.destroy();
                return;
            }

            if (!u.history[2027]) u.history[2027] = { quota: '' };
            const cut = u.cutStandards || { '50': false, '70': false, '90': false, '100': false };

            const checkedCuts = ['50', '70', '90', '100']
                .filter(p => cut[p])
                .map(p => p + '%')
                .join(', ');
            const minHeaderText = checkedCuts ? `최저 (${checkedCuts})` : '최저';

            if (!u.rates2027) u.rates2027 = [];
            u.rates2027.sort((a, b) => a.time.localeCompare(b.time));

            let latestRateText = '집계 중';
            if (u.rates2027 && u.rates2027.length > 0) {
                const filledSlots = u.rates2027.filter(s => s.rate !== '' && s.rate !== null && s.rate !== undefined);
                if (filledSlots.length > 0) {
                    const latest = filledSlots[filledSlots.length - 1];
                    latestRateText = `${latest.rate}:1 <span class="text-xs font-normal text-gray-500">(${latest.time})</span>`;
                }
            }

            const allDates = ['09/07', '09/08', '09/09', '09/10', '09/11'];
            
            const groupedHtml = allDates.map(date => {
                const slotsForDate = u.rates2027.filter(s => s.time.startsWith(date));
                
                return `
                    <div class="bg-gray-50/50 border border-gray-200 rounded-xl p-3 flex flex-col gap-2 min-w-0">
                        <div class="text-center text-sm font-bold text-gray-700 border-b border-gray-200 pb-2">${date}</div>
                        <div class="flex flex-col gap-2 max-h-[300px] overflow-y-auto pr-1 custom-scrollbar">
                            ${slotsForDate.length > 0 ? slotsForDate.map(item => {
                                const timeDisplay = item.time.split(' ')[1] || '';
                                const originalIndex = u.rates2027.indexOf(item);
                                return `
                                    <div class="bg-white border border-gray-200 p-2.5 rounded-lg flex flex-col gap-1.5 shadow-sm">
                                        <div class="flex justify-between items-center text-xs text-indigo-600 font-semibold">
                                            <span>${timeDisplay}</span>
                                            <button onclick="removeSlot(${originalIndex})" class="text-gray-300 hover:text-red-500 transition">&times;</button>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <input type="number" step="0.01" value="${item.rate}" onchange="updateRate2027(${originalIndex}, this.value)" placeholder="경쟁률" class="w-full bg-gray-50 border border-gray-200 rounded-md px-2 py-1.5 text-sm text-center focus:outline-none focus:bg-white focus:ring-1 focus:ring-indigo-500">
                                            <span class="text-xs text-gray-400">:1</span>
                                        </div>
                                    </div>
                                `;
                            }).join('') : '<div class="text-center text-xs text-gray-400 py-4">입력 대기중</div>'}
                        </div>
                    </div>
                `;
            }).join('');

            const tagObj = u.tags || { high: false, fit: false, safe: false };
            let tagText = '';
            if (tagObj.high) tagText += '[상향] ';
            if (tagObj.fit) tagText += '[적정] ';
            if (tagObj.safe) tagText += '[안정] ';

            detailEl.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-6 gap-4">
                    <div>
                        <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">${u.type}</span>
                        <div class="flex items-center gap-1.5 mt-2">
                            ${tagText ? `<span class="text-red-600 font-bold text-2xl">${tagText}</span>` : ''}
                            <h2 class="text-2xl font-bold text-gray-900">${u.name} - ${u.major}</h2>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-bold text-gray-700 mb-3">연도별 입시 결과 및 모집인원 요약</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-center text-sm border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs">
                                    <th class="p-3 rounded-l-xl">연도</th>
                                    <th class="p-3">모집인원</th>
                                    <th class="p-3">최종 경쟁률</th>
                                    <th class="p-3">추합인원</th>
                                    <th class="p-3">평균등급</th>
                                    <th class="p-3 rounded-r-xl">${minHeaderText}</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <tr class="bg-indigo-50/30 font-bold text-indigo-600">
                                    <td class="p-3">2027학년도</td>
                                    <td class="p-3">${u.history[2027].quota ? u.history[2027].quota + '명' : '-'}</td>
                                    <td class="p-3 font-semibold text-indigo-600" colspan="4">${latestRateText}</td>
                                </tr>
                                ${[2026, 2025, 2024].map(yr => `
                                    <tr>
                                        <td class="p-3 font-medium text-gray-700">${yr}학년도</td>
                                        <td class="p-3 text-gray-600">${u.history[yr]?.quota ? u.history[yr].quota + '명' : '-'}</td>
                                        <td class="p-3 font-semibold text-indigo-600">${u.history[yr]?.rate ? u.history[yr].rate + ':1' : '-'}</td>
                                        <td class="p-3 text-gray-600">${u.history[yr]?.extra !== undefined && u.history[yr]?.extra !== '' ? u.history[yr].extra + '명' : '-'}</td>
                                        <td class="p-3 text-gray-600">${u.history[yr]?.avg ? u.history[yr].avg + '등급' : '-'}</td>
                                        <td class="p-3 text-gray-600">${u.history[yr]?.min || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="space-y-3 pt-4 border-t">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-gray-700">2027 시간대별 경쟁률 추이 및 3개년 비교</h3>
                        <span class="text-xs text-gray-400">접수기간: 9/7 ~ 9/11</span>
                    </div>
                    <div class="bg-gray-50/50 p-4 pr-12 rounded-2xl border border-gray-100 relative h-80">
                        <canvas id="rateChart"></canvas>
                    </div>
                </div>

                <!-- 2027 접수 대상 대학 실시간 경쟁률 비교 그래프 -->
                <div class="space-y-3 pt-4 border-t">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-gray-700">2027 접수 대상 대학 실시간 경쟁률 비교</h3>
                        <span class="text-xs text-gray-400">전체 지원 대학 동시 비교</span>
                    </div>
                    <div class="bg-gray-50/50 p-4 rounded-2xl border border-gray-100 relative h-[450px]">
                        <canvas id="allUnivRateChart"></canvas>
                    </div>
                </div>

                <!-- 2027 시간대별 경쟁률 실시간 입력 영역 -->
                <div class="space-y-4 pt-4 border-t">
                    <h3 class="text-sm font-bold text-gray-700">2027 시간대별 경쟁률 실시간 입력</h3>
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
                        <div class="flex flex-wrap items-center gap-4 text-xs font-semibold text-gray-700">
                            <span>날짜 선택:</span>
                            <label class="flex items-center gap-1 cursor-pointer font-normal"><input type="checkbox" id="date-chk-09/07" onclick="selectDateCheckbox(this)" class="accent-indigo-600 w-4 h-4"> 9/7</label>
                            <label class="flex items-center gap-1 cursor-pointer font-normal"><input type="checkbox" id="date-chk-09/08" onclick="selectDateCheckbox(this)" class="accent-indigo-600 w-4 h-4"> 9/8</label>
                            <label class="flex items-center gap-1 cursor-pointer font-normal"><input type="checkbox" id="date-chk-09/09" onclick="selectDateCheckbox(this)" class="accent-indigo-600 w-4 h-4"> 9/9</label>
                            <label class="flex items-center gap-1 cursor-pointer font-normal"><input type="checkbox" id="date-chk-09/10" onclick="selectDateCheckbox(this)" class="accent-indigo-600 w-4 h-4"> 9/10</label>
                            <label class="flex items-center gap-1 cursor-pointer font-normal"><input type="checkbox" id="date-chk-09/11" onclick="selectDateCheckbox(this)" class="accent-indigo-600 w-4 h-4"> 9/11</label>
                        </div>
                        <div class="flex flex-wrap items-center gap-3 pt-2 border-t border-gray-200">
                            <span class="text-xs font-semibold text-gray-700">실시간 경쟁률:</span>
                            <input type="number" step="0.01" id="quick-rate-input" placeholder="예: 15.5" class="border border-gray-200 bg-white rounded-lg px-3 py-2 text-sm w-36 text-center focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <span class="text-xs text-gray-500">:1</span>
                            <button onclick="addDynamicRateRealtime()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-4 py-2.5 rounded-lg transition">+ 현재 시간으로 박스 추가</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 pt-1">
                        ${groupedHtml}
                    </div>
                </div>
            `;

            renderChart(u);
            renderAllUnivChart();
        }

        // ★ 차트 그리는 부분: 2027 데이터 유무에 상관없이 과거 3개년 수평선 무조건 가로 전체에 표시!
        function renderChart(u) {
            const ctx = document.getElementById('rateChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            let labels = u.rates2027.map(s => s.time);
            let data2027 = u.rates2027.map(s => s.rate ? parseFloat(s.rate) : null);

            // 데이터가 없어도 그래프 축이 생기게 더미 레이블 추가
            if (labels.length === 0) {
                labels = ['입력 대기 중'];
                data2027 = [null];
            }

            const final2024 = u.history[2024]?.rate ? parseFloat(u.history[2024].rate) : 0;
            const final2025 = u.history[2025]?.rate ? parseFloat(u.history[2025].rate) : 0;
            const final2026 = u.history[2026]?.rate ? parseFloat(u.history[2026].rate) : 0;

            // 차트 Y축 최대값 스케일 조정을 위해 계산
            let maxVal = Math.max(final2024, final2025, final2026);
            data2027.forEach(v => {
                if (v !== null && v > maxVal) maxVal = v;
            });
            let suggestedMax = Math.ceil((maxVal + 2) / 5) * 5;
            if (suggestedMax < 10) suggestedMax = 10;

            const rightLabelPlugin = {
                id: 'rightLabelPlugin',
                beforeDatasetsDraw(chart) {
                    const { ctx, chartArea, scales } = chart;
                    if (!chartArea) return;
                    const yScale = scales.y;
                    const rightX = chartArea.right + 8;
                    const leftX = chartArea.left; // 그래프 맨 왼쪽에서 시작

                    const lines = [
                        { val: final2026, text: '2026 (' + final2026 + ':1)', color: '#ef4444' },
                        { val: final2025, text: '2025 (' + final2025 + ':1)', color: '#f59e0b' },
                        { val: final2024, text: '2024 (' + final2024 + ':1)', color: '#10b981' }
                    ];

                    ctx.save();
                    lines.forEach(item => {
                        if (item.val > 0) {
                            const yCoord = yScale.getPixelForValue(item.val);
                            if (yCoord >= chartArea.top && yCoord <= chartArea.bottom) {
                                // 1. 선을 그래프 가로 전체 영역에 그림
                                ctx.beginPath();
                                ctx.setLineDash([6, 6]);
                                ctx.moveTo(leftX, yCoord);
                                ctx.lineTo(chartArea.right, yCoord);
                                ctx.strokeStyle = item.color;
                                ctx.lineWidth = 2;
                                ctx.stroke();

                                // 2. 그래프 맨 오른쪽 끝에 텍스트 표시
                                ctx.setLineDash([]);
                                ctx.fillStyle = item.color;
                                ctx.font = 'bold 11px sans-serif';
                                ctx.textBaseline = 'middle';
                                ctx.fillText(item.text, rightX, yCoord);
                            }
                        }
                    });
                    ctx.restore();
                }
            };

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '2027 현재 경쟁률',
                            data: data2027,
                            borderColor: '#4f46e5',
                            backgroundColor: '#4f46e5',
                            borderWidth: 3.5,
                            tension: 0.2,
                            spanGaps: true,
                        },
                        // 범례 표시용으로 남겨둠 (데이터를 비워 선은 플러그인에서 그리도록 함)
                        { label: '2026 최종', data: [], borderColor: '#ef4444', borderDash: [6, 6] },
                        { label: '2025 최종', data: [], borderColor: '#f59e0b', borderDash: [6, 6] },
                        { label: '2024 최종', data: [], borderColor: '#10b981', borderDash: [6, 6] }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { right: 85 } // 오른쪽 텍스트가 잘리지 않도록 패딩 확보
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            max: suggestedMax,
                            ticks: { stepSize: 5 }, 
                            grid: { color: '#f3f4f6' } 
                        },
                        x: { grid: { display: false } }
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { size: 12 }, boxWidth: 16 } }
                    }
                },
                plugins: [rightLabelPlugin]
            });
        }

        function renderAllUnivChart() {
            const canvasEl = document.getElementById('allUnivRateChart');
            if (!canvasEl) return;
            const ctx = canvasEl.getContext('2d');
            if (allUnivChartInstance) allUnivChartInstance.destroy();

            const sortedUnivs = [...universities].sort((a, b) => a.name.localeCompare(b.name, 'ko'));

            let allTimes = [];
            sortedUnivs.forEach(u => {
                if (u.rates2027) {
                    u.rates2027.forEach(slot => {
                        if (!allTimes.includes(slot.time)) allTimes.push(slot.time);
                    });
                }
            });
            allTimes.sort((a, b) => a.localeCompare(b));

            if (allTimes.length === 0) allTimes = ['입력 대기 중'];

            const colors = ['#4f46e5', '#ef4444', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6', '#ec4899', '#f97316'];

            let maxRate = 5;
            const datasets = sortedUnivs.map((u, index) => {
                const color = colors[index % colors.length];
                const dataMap = {};
                if (u.rates2027) {
                    u.rates2027.forEach(slot => {
                        const val = slot.rate ? parseFloat(slot.rate) : null;
                        dataMap[slot.time] = val;
                        if (val !== null && val > maxRate) maxRate = val;
                    });
                }
                const data = allTimes.map(t => dataMap[t] !== undefined ? dataMap[t] : null);

                return {
                    label: `${u.name} (${u.major})`,
                    data: data,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 2.5,
                    tension: 0.2,
                    spanGaps: true,
                };
            });

            let suggestedMax = Math.ceil((maxRate + 2) / 5) * 5;
            if (suggestedMax < 10) suggestedMax = 10;

            allUnivChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: allTimes,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { right: 20 }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            max: suggestedMax,
                            ticks: { 
                                stepSize: 5 
                            }, 
                            grid: { color: '#f3f4f6' } 
                        },
                        x: { grid: { display: false } }
                    },
                    plugins: {
                        legend: { 
                            position: 'bottom', 
                            labels: { 
                                font: { size: 10 }, 
                                boxWidth: 12,
                                padding: 15
                            } 
                        }
                    }
                }
            });
        }

        function selectUniv(id) {
            selectedId = id;
            renderList();
            renderDetail();
        }

        function openModal(editMode = false) {
            document.getElementById('univ-modal').classList.remove('hidden');
            document.getElementById('univ-modal').classList.add('flex');
            if(!editMode) {
                document.getElementById('modal-title').innerText = '새 지원 대학 등록';
                document.getElementById('univ-form').reset();
                document.getElementById('edit-id').value = '';
                
                document.getElementById('tag-high').checked = false;
                document.getElementById('tag-fit').checked = true;
                document.getElementById('tag-safe').checked = false;

                ['50', '70', '90', '100'].forEach(p => {
                    document.getElementById(`chk-${p}`).checked = (p === '70');
                });
            }
        }

        function closeModal() {
            document.getElementById('univ-modal').classList.remove('flex');
            document.getElementById('univ-modal').classList.add('hidden');
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('univ-name').value;
            const type = document.getElementById('univ-type').value;
            const major = document.getElementById('univ-major').value;

            const tags = {
                high: document.getElementById('tag-high').checked,
                fit: document.getElementById('tag-fit').checked,
                safe: document.getElementById('tag-safe').checked
            };

            const cutStandards = {
                '50': document.getElementById('chk-50').checked,
                '70': document.getElementById('chk-70').checked,
                '90': document.getElementById('chk-90').checked,
                '100': document.getElementById('chk-100').checked
            };

            const history = {
                2027: { quota: document.getElementById('q-2027').value },
                2026: { 
                    quota: document.getElementById('q-2026').value, 
                    rate: document.getElementById('r-2026').value, 
                    extra: document.getElementById('extra-2026').value,
                    avg: document.getElementById('avg-2026').value,
                    min: document.getElementById('min-2026').value
                },
                2025: { 
                    quota: document.getElementById('q-2025').value, 
                    rate: document.getElementById('r-2025').value, 
                    extra: document.getElementById('extra-2025').value,
                    avg: document.getElementById('avg-2025').value,
                    min: document.getElementById('min-2025').value
                },
                2024: { 
                    quota: document.getElementById('q-2024').value, 
                    rate: document.getElementById('r-2024').value, 
                    extra: document.getElementById('extra-2024').value,
                    avg: document.getElementById('avg-2024').value,
                    min: document.getElementById('min-2024').value
                }
            };

            if (editId) {
                const u = universities.find(item => item.id == editId);
                u.name = name;
                u.type = type;
                u.major = major;
                u.tags = tags;
                u.cutStandards = cutStandards;
                u.history = history;
            } else {
                const newUniv = {
                    id: Date.now(),
                    name, type, major, tags, history,
                    cutStandards,
                    rates2027: []
                };
                universities.push(newUniv);
                selectedId = newUniv.id;
            }

            saveToStorage();
            renderList();
            renderDetail();
            closeModal();
        }

        function editUniv(id) {
            const u = universities.find(item => item.id === id);
            if(!u) return;

            document.getElementById('modal-title').innerText = '지원 대학 정보 수정';
            document.getElementById('edit-id').value = u.id;
            document.getElementById('univ-name').value = u.name;
            document.getElementById('univ-type').value = u.type;
            document.getElementById('univ-major').value = u.major;

            const tags = u.tags || { high: false, fit: false, safe: false };
            document.getElementById('tag-high').checked = !!tags.high;
            document.getElementById('tag-fit').checked = !!tags.fit;
            document.getElementById('tag-safe').checked = !!tags.safe;

            const cut = u.cutStandards || { '50': false, '70': false, '90': false, '100': false };
            ['50', '70', '90', '100'].forEach(p => {
                document.getElementById(`chk-${p}`).checked = !!cut[p];
            });

            document.getElementById('q-2027').value = u.history[2027]?.quota || '';
            [2026, 2025, 2024].forEach(yr => {
                document.getElementById(`q-${yr}`).value = u.history[yr]?.quota || '';
                document.getElementById(`r-${yr}`).value = u.history[yr]?.rate || '';
                document.getElementById(`extra-${yr}`).value = u.history[yr]?.extra || '';
                document.getElementById(`avg-${yr}`).value = u.history[yr]?.avg || '';
                document.getElementById(`min-${yr}`).value = u.history[yr]?.min || '';
            });

            openModal(true);
        }

        function deleteUniv(id) {
            if(confirm('정말 삭제하시겠습니까?')) {
                universities = universities.filter(item => item.id !== id);
                if(selectedId === id) {
                    selectedId = universities.length > 0 ? universities[0].id : null;
                }
                saveToStorage();
            }
        }

        function updateRate2027(index, value) {
            const u = universities.find(item => item.id === selectedId);
            if(u) {
                u.rates2027[index].rate = value;
                saveToStorage();
                renderChart(u);
                renderAllUnivChart();
            }
        }

        function removeSlot(index) {
            const u = universities.find(item => item.id === selectedId);
            if(u) {
                u.rates2027.splice(index, 1);
                saveToStorage();
                renderDetail();
            }
        }
    </script>
</body>
</html>
